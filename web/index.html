<!DOCTYPE html>
<html lang="en">

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="C-AlgoVisualizer — Learn C programming and algorithms visually, step by step.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="C-AlgoVisualizer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>C-AlgoVisualizer</title>
  <link rel="manifest" href="manifest.json">

  <!-- ── Google Fonts for CYBER-ACADEMIC design ─────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;700&display=swap">

  <!-- ── Premium Loading Screen Styles ──────────────────────────────────── -->
  <style>
    /* CRITICAL: Make html/body fill viewport for Flutter canvas */
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Splash overlay ────────────────────────────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050505;
      transition: opacity 0.6s cubic-bezier(.4, 0, .2, 1);
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Logo / brand mark ─────────────────────────────────────────────── */
    .splash-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
      animation: slideUp 0.8s cubic-bezier(.16, 1, .3, 1) forwards;
      opacity: 0;
    }

    .splash-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #1A56DB, #7C3AED);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(26, 86, 219, 0.35);
    }

    .splash-icon svg {
      width: 26px;
      height: 26px;
    }

    .splash-title {
      font-size: 22px;
      font-weight: 700;
      color: #E2E8F0;
      letter-spacing: -0.5px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .splash-title span {
      color: #7C3AED;
    }

    /* ── Animated code lines ────────────────────────────────────────────── */
    .code-lines {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 40px;
      opacity: 0;
      animation: slideUp 0.8s 0.2s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .code-line {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .code-ln {
      color: #475569;
      font-size: 11px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      width: 18px;
      text-align: right;
    }

    .code-kw {
      color: #7C3AED;
      font-size: 13px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 600;
    }

    .code-fn {
      color: #60A5FA;
      font-size: 13px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    .code-str {
      color: #22C55E;
      font-size: 13px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    .code-pn {
      color: #94A3B8;
      font-size: 13px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    .code-ty {
      color: #34D399;
      font-size: 13px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    /* Typing cursor blink on last code line */
    .code-cursor {
      display: inline-block;
      width: 2px;
      height: 15px;
      background: #1A56DB;
      animation: blink 1s steps(1) infinite;
      vertical-align: middle;
      margin-left: 2px;
    }

    /* ── Progress bar ──────────────────────────────────────────────────── */
    .progress-wrap {
      width: 200px;
      height: 3px;
      background: #1A1D27;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
      opacity: 0;
      animation: slideUp 0.8s 0.4s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #1A56DB, #7C3AED);
      border-radius: 3px;
      animation: loadProgress 2.8s ease-in-out forwards;
    }

    /* ── Status text ───────────────────────────────────────────────────── */
    .splash-status {
      color: #64748B;
      font-size: 12px;
      letter-spacing: 0.3px;
      font-family: 'JetBrains Mono', monospace;
      opacity: 0;
      animation: slideUp 0.8s 0.5s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .splash-status::after {
      content: '';
      animation: dots 1.5s steps(4) infinite;
    }

    /* ── Keyframes ─────────────────────────────────────────────────────── */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {

      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    @keyframes loadProgress {
      0% {
        width: 0;
      }

      30% {
        width: 40%;
      }

      70% {
        width: 75%;
      }

      100% {
        width: 95%;
      }
    }

    @keyframes dots {
      0% {
        content: '';
      }

      25% {
        content: '.';
      }

      50% {
        content: '..';
      }

      75% {
        content: '...';
      }
    }

    @keyframes fadeCodeLine {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .cl1 {
      animation: fadeCodeLine 0.4s 0.3s ease-out forwards;
      opacity: 0;
    }

    .cl2 {
      animation: fadeCodeLine 0.4s 0.5s ease-out forwards;
      opacity: 0;
    }

    .cl3 {
      animation: fadeCodeLine 0.4s 0.7s ease-out forwards;
      opacity: 0;
    }

    .cl4 {
      animation: fadeCodeLine 0.4s 0.9s ease-out forwards;
      opacity: 0;
    }

    .cl5 {
      animation: fadeCodeLine 0.4s 1.1s ease-out forwards;
      opacity: 0;
    }

    /* ── Particles (decorative background) ─────────────────────────────── */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: floatUp 6s ease-in infinite;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0);
      }

      20% {
        opacity: 0.4;
      }

      100% {
        opacity: 0;
        transform: translateY(-200px) scale(1);
      }
    }

    /* Hide the default Flutter Web blue loading bar */
    .flutter-loader {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- ══════════════════════════════════════════════════════════════════════
       Premium Loading Screen — shown while Flutter bootstraps
       ══════════════════════════════════════════════════════════════════════ -->
  <div id="splash">
    <!-- Decorative floating particles -->
    <div class="particle" style="width:4px;height:4px;background:#1A56DB;left:20%;bottom:20%;animation-delay:0s;"></div>
    <div class="particle" style="width:3px;height:3px;background:#7C3AED;left:60%;bottom:15%;animation-delay:1.5s;">
    </div>
    <div class="particle" style="width:5px;height:5px;background:#22C55E;left:80%;bottom:25%;animation-delay:3s;"></div>
    <div class="particle" style="width:3px;height:3px;background:#60A5FA;left:35%;bottom:10%;animation-delay:2s;"></div>
    <div class="particle" style="width:4px;height:4px;background:#F59E0B;left:50%;bottom:30%;animation-delay:4s;"></div>

    <!-- Brand -->
    <div class="splash-logo">
      <div class="splash-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 5L3 12L8 19" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M16 5L21 12L16 19" stroke="white" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M14 4L10 20" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7" />
        </svg>
      </div>
      <div class="splash-title">C-Algo<span>Visualizer</span></div>
    </div>

    <!-- Animated code snippet -->
    <div class="code-lines">
      <div class="code-line cl1">
        <span class="code-ln">1</span>
        <span class="code-kw">#include</span>
        <span class="code-str">&lt;stdio.h&gt;</span>
      </div>
      <div class="code-line cl2">
        <span class="code-ln">2</span>
        <span class="code-ty">int</span>
        <span class="code-fn">main</span><span class="code-pn">() {</span>
      </div>
      <div class="code-line cl3">
        <span class="code-ln">3</span>
        <span class="code-pn" style="margin-left:16px"></span>
        <span class="code-fn">printf</span><span class="code-pn">(</span><span class="code-str">"Loading..."</span><span
          class="code-pn">);</span>
      </div>
      <div class="code-line cl4">
        <span class="code-ln">4</span>
        <span class="code-pn" style="margin-left:16px"></span>
        <span class="code-kw">return</span>
        <span class="code-pn">0;</span>
      </div>
      <div class="code-line cl5">
        <span class="code-ln">5</span>
        <span class="code-pn">}</span>
        <span class="code-cursor"></span>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>

    <div class="splash-status">Initializing engine</div>
  </div>

  <!-- ── Scripts ────────────────────────────────────────────────────────── -->

  <script>
    window.addEventListener('flutter-first-frame', () => {
      // Delay the fade out by 3.5 seconds to cover Flutter's dark screen
      // while it runs route transitions and initializes internally
      setTimeout(() => {
        const el = document.getElementById('splash');
        if (el) {
          el.classList.add('fade-out');
          setTimeout(() => el.remove(), 650);
        }
      }, 3500);

      // Load c_runner.js AFTER Flutter draws its first frame (non-blocking)
      const s = document.createElement('script');
      s.src = 'c_runner.js';
      document.head.appendChild(s);
    });

    // Safety fallback after 10s (increased from 6s to account for the new 3.5s delay)
    setTimeout(() => {
      const el = document.getElementById('splash');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(() => el.remove(), 650);
      }
    }, 10000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
